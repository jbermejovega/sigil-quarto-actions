name: test.yaml

permissions: read-all

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: |
          Quarto version, may be "release", "pre-release" or a version number.
        required: true
        default: release
        type: string
      tinytex:
        description: 'If true, install TinyTex, required for PDF rendering'
        required: false
        default: 'false'
        type: string

jobs:
  quarto-setup:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ inputs.version || matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: ${{ inputs.version && fromJSON(format('["{0}"]', inputs.version)) || fromJSON('["release", "pre-release", "1.8.25"]') }}
        config:
          - os: macos-latest
          - os: macos-15-intel
          - os: windows-latest
            tinytex: 'false'
          - os: ubuntu-latest
          - os: ubuntu-22.04-arm
            tinytex: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ matrix.version }}
          tinytex: ${{ inputs.tinytex || matrix.config.tinytex || 'true' }}

      - run: quarto --version
      - run: which quarto
        if: runner.os == 'Linux' || runner.os == 'macOS'
      - run: where.exe quarto
        if: runner.os == 'Windows'
