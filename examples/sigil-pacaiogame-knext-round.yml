on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "editorial/**"
      - "curation/**"
      - "pacaiogame/**"

name: Sigil PACAIOGAME KNEXT Round

permissions:
  contents: read

jobs:
  clear-and-play:
    runs-on: ubuntu-latest
    steps:
      - name: Check out resident repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Assert main sigilbook was materialized by Sigil KLI/QLI
        run: test -d .sigilbook

      - name: Clear localized workflow layer
        uses: jbermejovega/sigil-quarto-actions/clear-workflows@v2
        with:
          sigilbook-path: .sigilbook
          resident-path: .
          workflow-layer: .github/workflows
          witness-output: sigil-clearance-witness.json
          fail-on-hold: "true"

      - name: Play bounded KNEXT source round
        uses: jbermejovega/sigil-quarto-actions/play-knext-round@v2
        with:
          sigilbook-path: .sigilbook
          resident-path: .
          clearance-witness: sigil-clearance-witness.json
          witness-output: sigil-knext-round-witness.json
          round-id: knext.pacaiogame.editorial.local
