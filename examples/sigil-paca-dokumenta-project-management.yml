on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "docs/**"
      - "editorial/**"
      - "curation/**"
      - "quarto/**"
      - "pandoc/**"
      - "**/*.qmd"
      - "**/*.md"

name: Sigil PACA Dokumenta Project Management

permissions:
  contents: read

jobs:
  canonicalize-dokumenta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out resident repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Assert main sigilbook was materialized by Sigil KLI/QLI
        run: test -d .sigilbook

      - name: Clear localized workflow layer
        uses: jbermejovega/sigil-quarto-actions/clear-workflows@v2
        with:
          sigilbook-path: .sigilbook
          resident-path: .
          workflow-layer: .github/workflows
          witness-output: sigil-clearance-witness.json
          fail-on-hold: "true"

      - name: Canonicalize PACA Dokumenta project plan
        uses: jbermejovega/sigil-quarto-actions/canonicalize-dokumenta@v2
        with:
          sigilbook-path: .sigilbook
          resident-path: .
          project-path: .
          clearance-witness: sigil-clearance-witness.json
          witness-output: sigil-dokumenta-project-witness.json
          project-id: paca.dokumenta.editorial.local
